    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#0a0806; color:#f5f0eb; min-height:100vh; overflow-x:hidden; position:relative; }

        /* ===== BACKGROUND (matches main page) ===== */
        .bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .bg-gradient {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse 120% 80% at 20% 10%, rgba(180, 90, 20, 0.18) 0%, transparent 50%),
                radial-gradient(ellipse 100% 70% at 80% 20%, rgba(140, 50, 10, 0.15) 0%, transparent 55%),
                radial-gradient(ellipse 90% 60% at 50% 90%, rgba(100, 40, 10, 0.12) 0%, transparent 50%),
                linear-gradient(165deg, #0c0907 0%, #120e0a 40%, #0a0806 100%);
        }
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: orbFloat 18s ease-in-out infinite alternate;
        }
        .glow-orb.o1 { width: 520px; height: 520px; background: radial-gradient(circle, rgba(245, 170, 40, 0.22) 0%, transparent 70%); top: -12%; left: -8%; animation-duration: 22s; }
        .glow-orb.o2 { width: 420px; height: 420px; background: radial-gradient(circle, rgba(220, 90, 30, 0.18) 0%, transparent 70%); top: 35%; right: -10%; animation-duration: 19s; animation-delay: -4s; }
        .glow-orb.o3 { width: 380px; height: 380px; background: radial-gradient(circle, rgba(255, 190, 60, 0.14) 0%, transparent 70%); bottom: -8%; left: 30%; animation-duration: 25s; animation-delay: -9s; }
        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -40px) scale(1.08); }
            100% { transform: translate(-20px, 25px) scale(0.95); }
        }
        .noise {
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            opacity: 0.035;
            mix-blend-mode: overlay;
        }

        .container { max-width:1100px; margin:0 auto; padding:0 24px 60px; position:relative; z-index:1; }
        .header { display:flex; justify-content:space-between; align-items:center; padding: 10px 0; }
        .logo { display:flex; align-items:center; gap:12px; }
        .logo img { width:110px; height:110px; object-fit:contain; filter:drop-shadow(0 0 12px rgba(245,200,66,0.4)); }
        .logo-text { font-weight:800; font-size:20px; letter-spacing:1px; }
        .logo-sub { font-size:12px; color:#c9a86a; }
        .back-link { color:#f5a828; text-decoration:none; font-weight:600; }
        .back-link:hover { text-decoration:underline; }
        .detail { display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center; margin-top:30px; }
        .detail-ph { width:100%; height:360px; border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,0.5); background:linear-gradient(135deg,#2a1c10,#3a2412); display:flex; align-items:center; justify-content:center; font-size:120px; }
        .detail-name { font-size:42px; font-weight:800; margin-bottom:10px; }
        .detail-badge { display:inline-block; background:linear-gradient(135deg,#f5a828,#e8861a); color:#1a1208; font-weight:700; padding:5px 14px; border-radius:20px; font-size:13px; margin-bottom:14px; }
        .detail-desc { font-size:18px; line-height:1.6; color:#e8ddcf; margin-bottom:18px; }
        .ingredients { list-style:none; margin-bottom:22px; }
        .ingredients li { padding:8px 0 8px 26px; position:relative; border-bottom:1px solid rgba(255,255,255,0.06); }
        .ingredients li:before { content:'🍕'; position:absolute; left:0; }
        .price-row { display:flex; align-items:center; gap:20px; margin-bottom:24px; }
        .price { font-size:32px; font-weight:800; color:#f5a828; }
        .btn-order { background:linear-gradient(135deg,#f5a828,#e8861a); color:#1a1208; border:none; padding:14px 30px; border-radius:30px; font-weight:700; font-size:16px; cursor:pointer; }
        .btn-order:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(245,168,40,0.4); }
        .footer { text-align:center; padding:30px 0; color:#9c8a72; border-top:1px solid rgba(255,255,255,0.06); margin-top:50px; }
        @media (max-width:768px){ .detail{grid-template-columns:1fr;} .detail-name{font-size:32px;} }
    </style>
</head>
<body>
    <div class="bg-layer">
        <div class="bg-gradient"></div>
        <div class="glow-orb o1"></div>
        <div class="glow-orb o2"></div>
        <div class="glow-orb o3"></div>
        <div class="noise"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="images/photo_5215361255936303334_y.jpg" alt="Napoli из печи" />
                <div>
                    <div class="logo-text">Napoli из печи</div>
                    <div class="logo-sub">La Cucina Italiana</div>
                </div>
            </div>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> В меню</a>
        </header>

        <section class="detail">
            <div class="detail-ph">🍕</div>
            <div>
                
                <h1 class="detail-name">Маргарита</h1>
                <p class="detail-desc">Томатный соус, моцарелла, базилик, пармезан</p>
                <ul class="ingredients">
                    <li>Томатный соус</li><li>моцарелла</li><li>базилик</li><li>пармезан</li>
                </ul>
                <div class="price-row">
                    <div class="price">25 BYN</div>
                    <button class="btn-order" onclick="alert('🍕 Маргарита добавлена в корзину!')">Заказать</button>
                </div>
                <a href="index.html#menu" class="back-link">← Вернуться в меню</a>
            </div>
        </section>

        <footer class="footer">
            <span>© 2026 Napoli из печи. Сделано с любовью к Италии.</span>
        </footer>
    </div>
</body>
